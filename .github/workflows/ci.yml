name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter on `pull_request`. With one, a pull request
  # whose base is another branch -- a stacked PR, the natural shape for
  # a change that builds on an unmerged one -- matches nothing and gets
  # **no checks at all**. Not a red build: an empty one, which reads as
  # "nothing to report" rather than "nothing ran".
  #
  # `push` stays pinned to `main` so a branch does not build twice, once
  # for the push and once for its pull request.
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --all-features

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A requirement nothing verifies is a request. This checks every
      # commit the pull request adds, and reports all failures at once
      # rather than the first -- rewriting history twice because the
      # second bad commit was hidden by the first is a waste of
      # everyone's afternoon.
      - name: Every commit must carry a Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          [ -n "$base" ] || { echo "not a pull request; nothing to check"; exit 0; }

          fail=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # Bots cannot sign off, and requiring it of them would
            # block every Dependabot update on a technicality.
            case "$author" in
              *"[bot]"*|*"dependabot"*) continue ;;
            esac
            if ! git log -1 --format='%B' "$sha" | grep -qi "^Signed-off-by: .\+ <.\+@.\+>"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by"
              fail=1
            fi
          done <<< "$(git rev-list "$base..$head")"

          if [ "$fail" -ne 0 ]; then
            echo "Sign off with: git commit -s  (or: git rebase --signoff $base)"
            echo "See DCO in the repository root for what you are certifying."
            exit 1
          fi
          echo "every commit is signed off"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm:
    name: Build for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the version `rust-toolchain.toml` names, not
      # `stable`. The action installs the target for the toolchain it
      # installs, but `rust-toolchain.toml` then overrides which
      # toolchain actually runs -- so `stable` here installed
      # `wasm32-unknown-unknown` for a toolchain the build never used,
      # and the build failed with `can't find crate for std`.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The native `cargo test` job above proves the logic; this proves
      # the crate still reaches its actual target. A change that builds
      # natively can still fail to compile to wasm, and that failure
      # would otherwise surface only to whoever ran `wasm-pack` next.
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack build --target web --release
      # The `#[wasm_bindgen]` layer cannot run under `cargo test`, so
      # without this job nothing exercises the JavaScript-facing API at
      # all — only the `core` module beneath it.
      - run: wasm-pack test --node
      - name: The generated package must carry the bindings
        run: |
          test -f pkg/oxml_wasm_bg.wasm
          test -f pkg/oxml_wasm.js
          test -f pkg/oxml_wasm.d.ts
          grep -q 'queryText' pkg/oxml_wasm.d.ts
          echo "bindings generated"
      # The Node examples assert rather than print, and say so in their
      # own headers -- "an example that asserts fails CI instead" --
      # but nothing ran them. They go here rather than in a job of
      # their own because they need the same `wasm-pack` build, which
      # takes minutes.
      - name: Run every Node example, which asserts its own output
        run: ./examples/run-all.sh

  unsafe:
    name: Forbid unsafe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The crate must forbid unsafe code
        run: |
          if ! grep -rq '#!\[forbid(unsafe_code)\]' src/; then
            echo "::error::#![forbid(unsafe_code)] is missing"
            exit 1
          fi
          echo "unsafe_code is forbidden"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every defect fixed in 0.0.3 was found by raising coverage, not
      # by reading the code. The floor keeps that from eroding: a new
      # branch nothing exercises fails here rather than shipping.
      - run: >
          cargo llvm-cov --all-features --fail-under-lines 95
          --ignore-filename-regex 'builds/cargo/package|src/lib\.rs'
